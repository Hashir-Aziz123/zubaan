# One run per model; override the label, GGUF and output on the command line:
#   zubaan tune check --config configs/chat-check.yaml --label stage3 \
#     --gguf outputs/adapted-export/qwen3-1.7b-urdu-adapted-Q8_0.gguf --output reports/chat_check_stage3.json
chat_check:
  label: base
  gguf: outputs/base-gguf/Qwen3-1.7B-Q8_0.gguf   # Qwen/Qwen3-1.7B-GGUF, the official file
  server_url: http://127.0.0.1:8080
  llama_cpp_dir: tools/llama.cpp-b12477
