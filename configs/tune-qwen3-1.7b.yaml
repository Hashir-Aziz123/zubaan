# Stage 4 for Qwen3-1.7B: chat SFT of the merged Stage 3 model on teacher-written conversations.
#   uv run zubaan tune run --config configs/tune-qwen3-1.7b.yaml --steps 30   # smoke run, T4
#   uv run zubaan tune run --config configs/tune-qwen3-1.7b.yaml              # full run, T4
#   uv run zubaan tune merge --config configs/tune-qwen3-1.7b.yaml
# Decisions and reasons: docs/decisions.md, 2026-11-26. Learning rate and epochs are starting
# values to check in the smoke run. On Kaggle the notebook overrides model_path, train_file,
# output_dir and hub_repo.

tune:
  model_path: outputs/adapted/model          # merged Stage 3 model (Kaggle: output of notebook 07)
  train_file: data/tune/conversations.jsonl  # filtered conversations (chunk 4)
  max_len: 4096
  val_share: 0.02

  output_dir: outputs/tuned
  epochs: 2
  micro_batch_size: 1
  grad_accum: 16            # 16 packed rows of up to 4,096 tokens, about 60 conversations
  lr_lora: 1.0e-4
  train_new_rows: false     # plan: start frozen
  warmup_steps: 20
  lora_rank: 64
  lora_alpha: 128
  lora_dropout: 0.05
  precision: fp16           # T4 has no BF16; switch to fp32 only if the loss goes NaN
  gradient_checkpointing: true
  device: cuda
  seed: 0

  log_every: 5
  eval_every: 50
  checkpoint_every: 50
  keep_checkpoints: 2
  resume: true
  hub_repo: null            # private repo for checkpoints; needs HF_TOKEN
  hub_private: true
